<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset ="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="Ran.css">
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Iceland&display=swap" rel="stylesheet">
        <title>Random Number Generator</title>
    </head>

    <body style="background-color: black;">

        <span class="title">Random Number Generator</span>

        <p1 class="bignumber" id="number">0</p1>

        <div class="range">
            <button class="Ten" id="tenbtn">0-10</button>
            <button class="Twenty" id="Twenbtn">0-20</button>
            <button class="Hundred" id="hunbtn">0-100</button>
            <button class="Thousand" id="Thobtn">0-1000</button>
            <button class="fivek" id="fivebtn">0-5000</button>
            <button class="tenk" id="tenkbtn">0-10000</button>
        </div>

        <script src="Ran.js"></script>
    </body>
</html>
